# =============================================================================
# Hyperfoil Fixed-Rate Load Test Configuration
# =============================================================================
#
# This configuration file defines a sustained fixed-rate load test scenario.
# It includes a warmup ramp followed by a steady-state measurement phase
# at a constant request rate.
#
# All phases target the same HTTP endpoint.
#
# Configurable Parameters:
# ----------------------------------
# PROTOCOL               - HTTP protocol to use (default: http)
#                           Options: http, https
# HOST                   - Target server hostname (default: localhost)
# PORT                   - Target server port (default: 8080)
# CONNECTIONS            - Number of HTTP connections (default: 500)
# MAX_SESSIONS           - Maximum concurrent sessions (default: 10000)
# HIDE_WARMUP_PHASE      - Hide the warmup phase details (default: false)
# PATH                   - HTTP endpoint path to test (default: /fruits)
# WARMUP_DURATION        - Duration of the warmup ramp phase (default: 30s)
# WARMUP_MAX_DURATION    - Maximum duration of the warmup phase (default: 1m)
# WARMUP_PAUSE_DURATION  - Duration of the pause between warmup and load test (default: 10s)
# WARMUP_REQUEST_TIMEOUT - Timeout for warmup requests (default: 30s)
# LOAD_REQUEST_TIMEOUT   - Timeout for load test requests (default: 30s)
# LOAD_DURATION          - Duration of the load test phase (default: 150s)
# LOAD_MAX_DURATION      - Maximum duration of the load test phase (default: 5m)
# LOAD_RATE              - Target request rate in requests/sec (default: 5000)
# THREADS                - Number of threads to use (default: 2)
#
# Usage:
# ------
# Override parameters using: -P PARAM_NAME=value
# Example: jbang run@hyperfoil -PLOAD_RATE=3000 -PLOAD_DURATION=300s load-test-fixed-rate-read-all.hf.yml
#
# =============================================================================

name: load-test-fixed-rate-read-all
threads: !param THREADS 2
http:
  - protocol: !param PROTOCOL http
    host: !param HOST localhost
    port: !param PORT 8080
    sharedConnections: !param CONNECTIONS 500
    allowHttp2: false
    useHttpCache: false
ergonomics:
  repeatCookies: false
  userAgentFromSession: false

phases:
  - warmup:
      increasingRate:
        initialUsersPerSec: 1
        targetUsersPerSec: !param LOAD_RATE 5000
        duration: !param WARMUP_DURATION 30s
        maxDuration: !param WARMUP_MAX_DURATION 1m
        isWarmup: !param HIDE_WARMUP_PHASE false
        maxSessions: !param MAX_SESSIONS 10000
        variance: false
        scenario:
          maxRequests: 1
          maxSequences: 1
          orderedSequences:
            - getAllFruits:
                - httpRequest:
                      GET: !param PATH /fruits
                      timeout: !param WARMUP_REQUEST_TIMEOUT 30s
                      headers:
                        accept: application/json

  - cooldown:
      noop:
        startAfter: warmup
        duration: !param WARMUP_PAUSE_DURATION 10s

  - logStart:
      atOnce:
        users: 1
        startAfterStrict:
          - warmup
          - cooldown
        scenario:
          maxRequests: 1
          maxSequences: 1
          orderedSequences:
            - log:
                - timestamp:
                    toVar: now
                    pattern: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
                - log: "loadTest started at ${now}"

  - loadTest:
      constantRate:
        usersPerSec: !param LOAD_RATE 5000
        duration: !param LOAD_DURATION 150s
        maxDuration: !param LOAD_MAX_DURATION 5m
        startAfterStrict: logStart
        maxSessions: !param MAX_SESSIONS 10000
        variance: false
        scenario:
          maxRequests: 1
          maxSequences: 1
          orderedSequences:
            - getAllFruits:
                - httpRequest:
                      GET: !param PATH /fruits
                      timeout: !param LOAD_REQUEST_TIMEOUT 30s
                      headers:
                        accept: application/json

failurePolicy: CONTINUE
