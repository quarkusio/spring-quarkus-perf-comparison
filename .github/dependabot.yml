version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "version-upgrade"
    cooldown:
      default-days: 7

  # All Maven modules, plus the root aggregator (which owns the root Maven
  # wrapper). `group-by: dependency-name` collapses a bump that spans several
  # modules into a single pull request instead of one per directory.
  - package-ecosystem: maven
    directories:
      - /
      - /quarkus3
      - /quarkus3-spring-compatibility
      - /quarkus3-virtual
      - /springboot3
      - /springboot4
    schedule:
      interval: weekly
    labels:
      - "version-upgrade"
    ignore:
      - dependency-name: "io.quarkus.platform:*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "io.opentelemetry.instrumentation:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    cooldown:
      default-days: 3
    groups:
      all-modules:
        group-by: dependency-name

  # OOTB branch
  - package-ecosystem: github-actions
    directory: /
    target-branch: ootb
    schedule:
      interval: weekly
    labels:
      - "version-upgrade"
    cooldown:
      default-days: 7

  # No OpenTelemetry on the ootb branch, so no OpenTelemetry ignore rule here.
  - package-ecosystem: maven
    directories:
      - /
      - /quarkus3
      - /quarkus3-spring-compatibility
      - /quarkus3-virtual
      - /springboot3
      - /springboot4
    target-branch: ootb
    schedule:
      interval: weekly
    labels:
      - "version-upgrade"
    ignore:
      - dependency-name: "io.quarkus.platform:*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 3
    groups:
      all-modules:
        group-by: dependency-name
